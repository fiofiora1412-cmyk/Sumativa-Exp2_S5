mensaje.config.server=Configuracion centralizada desde Config Server

spring.datasource.url=jdbc:postgresql://localhost:5432/bank_batch
spring.datasource.username=postgres
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/


eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.instance.hostname=127.0.0.1

resilience4j.circuitbreaker.instances.intereses.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.intereses.slidingWindowSize=5
resilience4j.circuitbreaker.instances.intereses.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.intereses.failureRateThreshold=50
resilience4j.circuitbreaker.instances.intereses.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.intereses.permittedNumberOfCallsInHalfOpenState=2
spring.cloud.circuitbreaker.resilience4j.disable-time-limiter=true

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=ms-intereses
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.bankxyz.ms_intereses.model
spring.kafka.consumer.properties.spring.json.value.default.type=com.bankxyz.ms_intereses.model.TransaccionProcesadaEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false