mensaje.config.server=Configuracion centralizada desde Config Server

spring.datasource.url=jdbc:postgresql://localhost:5432/bank_batch
spring.datasource.username=postgres
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.instance.hostname=127.0.0.1

resilience4j.circuitbreaker.instances.transacciones.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.transacciones.slidingWindowSize=5
resilience4j.circuitbreaker.instances.transacciones.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.transacciones.failureRateThreshold=50
resilience4j.circuitbreaker.instances.transacciones.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.transacciones.permittedNumberOfCallsInHalfOpenState=2
spring.cloud.circuitbreaker.resilience4j.disable-time-limiter=true

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer